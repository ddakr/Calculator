<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main>        
        <div class="frame" id="frame">
            <div class="frame-inner" id="frame-inner">
                <div class="display">
                    <div class="inner-display">                      
                        <p>0</p>
                    </div>
                </div>
                <div class="row">
                    <button class="gray" data-value="backspace">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                    <button class="gray" data-value="AC">AC</button>
                    <button class="gray" data-value="%">%</button>
                    <button class="orange" data-value="/">
                        <i class="fa-solid fa-divide"></i>
                    </button>
                </div>
                <div class="row">
                    <button data-value="7">7</button>
                    <button data-value="8">8</button>
                    <button data-value="9">9</button>
                    <button class="orange" data-value="*">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="row">
                    <button data-value="4">4</button>
                    <button data-value="5">5</button>
                    <button data-value="6">6</button>
                    <button class="orange" data-value="-">
                        <i class="fa-solid fa-minus"></i>
                    </button>
                </div>
                <div class="row">
                    <button data-value="1">1</button>
                    <button data-value="2">2</button>
                    <button data-value="3">3</button>
                    <button class="orange" data-value="+">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div class="row">
                    <button data-value="sqrt">
                        <i class="fa-solid fa-square-root-variable"></i>
                    </button>
                    <button data-value="power">
                        <i class="fa-solid fa-superscript"></i>
                    </button>
                    <button data-value="0">0</button>
                    <button class="orange" data-value="=">
                        <i class="fa-solid fa-equals"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
